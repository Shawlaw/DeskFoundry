[package]
name = "desktop-notify"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Portable Windows toast notifications with explicit AppUserModelID registration"
repository = "https://github.com/Shawlaw/DeskFoundry"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
